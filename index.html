
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="styelee.css">
</head>

<body>

    <!-- Theme Toggle -->
    <nav class="theme-toggle">
        <span class="brand">Weather<span>Now</span></span>
        <button id="themeBtn" type="button">🌙 Dark</button>
    </nav>

    <main class="container">

        <!-- Header -->
        <header class="page-header">
            <h1>Weather Dashboard</h1>
            <p>Discover the weather in your city</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
                aria-label="Enter city name"
            >

            <button id="searchBtn" type="button">
                Search Weather
            </button>

            <div id="suggestions" class="suggestions"></div>

        </section>

        <!-- Loading -->
        <div
            id="loading"
            class="loading"
            style="display: none;"
            role="status"
        >
            Loading weather...
        </div>

        <!-- Error -->
        <div
            id="errorMsg"
            class="error"
            style="display: none;"
            role="alert"
        ></div>

        <!-- Current Weather -->
        <section
            id="weatherCard"
            class="weather-card"
            aria-label="Current weather information"
        ></section>

        <!-- Favorites -->
        <section class="favorites-section">

            <h2>⭐ Favorite Cities</h2>

            <div id="favoritesList"></div>

        </section>

        <!-- Five Day Forecast -->
        <section class="forecast-section">

            <h2 class="forecast-title">5 Day Forecast</h2>

            <div
                id="forecastcard"
                class="forecast-cards"
            ></div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="weth.js"></script>

</body>
</html>
